valid_inputs:
- input_id: synthetic_ribo_rna_counts
  workflow_id: dteg_cli
  input_manifest:
    ribo_count_matrix:
      matrix_state: raw_counts
      matrix_orientation: genes_by_samples
    rna_count_matrix:
      matrix_state: raw_counts
      matrix_orientation: genes_by_samples
    sample_info_file:
      required_columns:
      - SampleID
      - Condition
      - SeqType
      - Batch
  expected_behavior: blocked_until_reviewed_or_dry_run
  expected_validation: pass
invalid_inputs:
- input_id: normalized_tpm_matrix
  workflow_id: dteg_cli
  input_manifest:
    matrix_state: normalized_tpm
    validation_errors:
    - raw counts required
  expected_behavior: block
  expected_reason_contains:
  - raw counts
- input_id: missing_seqtype
  workflow_id: dteg_cli
  input_manifest:
    validation_errors:
    - missing SeqType
  expected_behavior: block
  expected_reason_contains:
  - SeqType
