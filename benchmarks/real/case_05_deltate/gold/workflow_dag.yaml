nodes:
- id: prepare_ribo_counts
  type: load_data
  expected_input:
    name: ribo_counts
    matrix_state: raw_counts
    orientation: genes_by_samples
- id: prepare_rna_counts
  type: load_data
  expected_input:
    name: rna_counts
    matrix_state: raw_counts
    orientation: genes_by_samples
- id: prepare_sample_info
  type: load_metadata
  expected_columns:
  - SampleID
  - Condition
  - SeqType
  - Batch
- id: run_dteg_r
  type: cli_execution
  expected_command:
  - Rscript
  - --vanilla
  - DTEG.R
  expected_arguments:
  - ribo_count_matrix
  - rna_count_matrix
  - sample_info_file
  - batch_effect_covariate_flag
- id: classify_differential_translation
  type: statistical_analysis
  expected_outputs:
  - DTEG_results
  - DTG_classification
  - sample_data/Results
edges:
- prepare_ribo_counts -> run_dteg_r
- prepare_rna_counts -> run_dteg_r
- prepare_sample_info -> run_dteg_r
- run_dteg_r -> classify_differential_translation
