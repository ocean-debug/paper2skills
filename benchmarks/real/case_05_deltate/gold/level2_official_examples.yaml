official_examples:
- example_id: minimal_dteg_cli_smoke
  tutorial_id: readme
  workflow_id: dteg_cli
  execution_mode: smoke
  allow_download: false
  fixture_files:
  - source: data/official_examples/minimal/ribo_counts.tsv
    target: .benchmark/fixtures/deltate/ribo_counts.tsv
  - source: data/official_examples/minimal/rna_counts.tsv
    target: .benchmark/fixtures/deltate/rna_counts.tsv
  - source: data/official_examples/minimal/sample_info.tsv
    target: .benchmark/fixtures/deltate/sample_info.tsv
  reviewed_adapter:
    status: verified
    adapter_type: cli
    files:
    - source: data/official_examples/minimal/reviewed_cli_adapter.py
      target: scripts/adapters/cli_adapter.py
    - source: data/official_examples/minimal/reviewed_environment_spec.json
      target: assets/environment_spec.yaml
    adapter_spec:
      adapter_type: cli
      status: verified
      entrypoint: scripts/adapters/cli_adapter.py
      command: reviewed L2 dry-run adapter
      evidence:
      - level2_official_examples.yaml
      - data/official_examples/minimal/ribo_counts.tsv
      - data/official_examples/minimal/rna_counts.tsv
      - data/official_examples/minimal/sample_info.tsv
      caveats:
      - Benchmark-reviewed dry-run adapter for minimal paired Ribo/RNA fixture; no package install or notebook execution.
    adapter_review:
      adapter_type: cli
      status: verified
      human_approved: true
      dry_run:
        status: pass
        scope: L2 minimal paired Ribo/RNA fixture
      expected_outputs:
      - Results/fold_changes/deltaTE.txt
      - Results/gene_lists/DTEGs.txt
      - results/summary.json
      caveats:
      - Verified only for L2 minimal fixture execution.
  input_manifest:
    inputs:
      primary_data:
        path: .benchmark/fixtures/deltate/ribo_counts.tsv
        ribo_count_matrix: .benchmark/fixtures/deltate/ribo_counts.tsv
        rna_count_matrix: .benchmark/fixtures/deltate/rna_counts.tsv
        sample_info_file: .benchmark/fixtures/deltate/sample_info.tsv
        exists: true
      algorithm:
        mode: reviewed_smoke
        parameters:
          condition_col: Condition
          seq_type_col: SeqType
  expected_preflight:
    missing_dependencies_allowed: true
    install_plan_required_if_missing: true
  expected_run:
    expected_status: success
  expected_outputs:
  - name: deltaTE fold changes
    path: Results/fold_changes/deltaTE.txt
    required: true
    validation: delta_te_table_exists
  - name: DTEG gene list
    path: Results/gene_lists/DTEGs.txt
    required: true
    validation: dteg_gene_list_exists
  - name: summary
    path: results/summary.json
    required: true
    validation: result_directory_exists
