tasks:
- task_id: valid_cli_request
  user_command: Use deltaTE on these paired Ribo-seq and RNA-seq raw count matrices.
  workflow_id: dteg_cli
  expected_behavior:
    action: explain_candidate_status
    reason_contains:
    - adapter_status
    must_reference:
    - io_contract
    - bio_contract
    - adapter_status
    must_not:
    - auto_install
    - invent_results
- task_id: normalized_input_refusal
  user_command: Use deltaTE on this normalized TPM matrix.
  workflow_id: dteg_cli
  expected_behavior:
    action: refuse
    reason_contains:
    - raw
    must_reference:
    - io_contract
    must_not:
    - invent_results
