official_examples:
- example_id: minimal_embedding_smoke
  tutorial_id: official_documentation
  workflow_id: main
  execution_mode: smoke
  allow_download: false
  fixture_files:
  - source: data/official_examples/minimal/expr.csv
    target: .benchmark/fixtures/concord/expr.csv
  - source: data/official_examples/minimal/obs.csv
    target: .benchmark/fixtures/concord/obs.csv
  reviewed_adapter:
    status: verified
    adapter_type: python_api
    files:
    - source: data/official_examples/minimal/reviewed_python_api_adapter.py
      target: scripts/adapters/python_api_adapter.py
    - source: data/official_examples/minimal/reviewed_environment_spec.json
      target: assets/environment_spec.yaml
    adapter_spec:
      adapter_type: python_api
      status: verified
      entrypoint: scripts/adapters/python_api_adapter.py
      module: scripts.adapters.python_api_adapter
      function: run
      evidence:
      - level2_official_examples.yaml
      - data/official_examples/minimal/expr.csv
      - data/official_examples/minimal/obs.csv
      caveats:
      - Benchmark-reviewed smoke adapter for minimal AnnData-like fixture; no package install or notebook execution.
    adapter_review:
      adapter_type: python_api
      status: verified
      human_approved: true
      entrypoint: scripts/adapters/python_api_adapter.py
      module: scripts.adapters.python_api_adapter
      function: run
      dry_run:
        status: pass
        scope: L2 minimal CONCORD embedding fixture
      expected_outputs:
      - results/concord_embedding.csv
      - results/summary.json
      caveats:
      - Verified only for L2 minimal fixture execution.
  input_manifest:
    inputs:
      primary_data:
        path: .benchmark/fixtures/concord/expr.csv
        expression_matrix: .benchmark/fixtures/concord/expr.csv
        exists: true
        matrix_state: log1p
      metadata:
        path: .benchmark/fixtures/concord/obs.csv
        exists: true
      algorithm:
        mode: reviewed_smoke
        parameters:
          domain_key: batch
          output_obsm_key: Concord
  expected_preflight:
    missing_dependencies_allowed: true
    install_plan_required_if_missing: true
  expected_run:
    expected_status: success
  expected_outputs:
  - name: concord_embedding
    path: results/concord_embedding.csv
    required: true
    validation: embedding_rows_match_cells
  - name: summary
    path: results/summary.json
    required: true
    validation: summary_json_exists
  sanity_checks:
  - check: embedding_table_has_cell_and_concord_dimensions
