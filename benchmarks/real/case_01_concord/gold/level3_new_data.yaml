valid_inputs:
- input_id: tiny_anndata
  workflow_id: main
  input_manifest:
    format: h5ad
    matrix_state: normalized
    metadata:
      batch_key: batch
  expected_behavior: blocked_until_reviewed
  expected_validation: pass
invalid_inputs:
- input_id: missing_expression_matrix
  workflow_id: main
  input_manifest:
    validation_errors:
    - missing expression matrix
  expected_behavior: block
  expected_reason_contains:
  - expression matrix
