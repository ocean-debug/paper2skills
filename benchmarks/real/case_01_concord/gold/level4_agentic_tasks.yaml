tasks:
- task_id: valid_embedding_request_candidate
  user_command: Use CONCORD to integrate this valid AnnData dataset.
  workflow_id: main
  provided_inputs:
    input_manifest: tiny_anndata
  expected_behavior:
    action: explain_candidate_status
    reason_contains:
    - candidate
    must_reference:
    - io_contract
    - bio_contract
    - adapter_status
    must_not:
    - auto_install
    - invent_results
- task_id: wrong_task_refusal
  user_command: Use CONCORD to predict gene knockout perturbation response.
  workflow_id: main
  expected_behavior:
    action: refuse
    reason_contains:
    - bio_contract
    must_reference:
    - bio_contract
    must_not:
    - invent_results
