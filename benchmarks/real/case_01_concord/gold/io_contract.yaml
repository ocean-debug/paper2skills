primary_input:
  object_type: AnnData
  accepted_formats:
  - h5ad
  - 10x_mtx
  - AnnData_object
  matrix_state_before_model:
    expected: log1p
    raw_counts_evidence: input can start from raw counts
    preprocessing_required:
    - normalize_total
    - log1p
metadata:
  batch_key:
    name: domain_key
    required_for_batch_integration: true
    default_if_single_batch: not_required
  cell_type_key:
    required: false
    value: not_confirmed
output:
  latent_embedding:
    location: adata.obsm['Concord']
    required: true
  umap:
    location: adata.obsm or generated plot
    required: optional
  figures:
  - Concord_UMAP.png
  - Concord_UMAP_3D.html
