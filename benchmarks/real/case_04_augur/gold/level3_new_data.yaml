valid_inputs:
- input_id: synthetic_scrna_matrix
  workflow_id: main
  input_manifest:
    format: count_matrix
    matrix_state: preprocessed
    matrix_orientation: genes_by_cells
    metadata:
      cell_type_key: cell_type
      label_key: label
  expected_behavior: blocked_until_reviewed_or_dry_run
  expected_validation: pass
invalid_inputs:
- input_id: missing_cell_type
  workflow_id: main
  input_manifest:
    validation_errors:
    - missing cell_type
  expected_behavior: block
  expected_reason_contains:
  - cell_type
- input_id: missing_label
  workflow_id: main
  input_manifest:
    validation_errors:
    - missing label
  expected_behavior: block
  expected_reason_contains:
  - label
