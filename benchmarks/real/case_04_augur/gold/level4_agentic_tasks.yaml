tasks:
- task_id: valid_auc_request
  user_command: Use Augur to prioritize cell types from this preprocessed scRNA matrix and metadata.
  workflow_id: main
  expected_behavior:
    action: explain_candidate_status
    reason_contains:
    - adapter_status
    must_reference:
    - io_contract
    - bio_contract
    - adapter_status
    must_not:
    - auto_install
    - invent_results
- task_id: missing_metadata_refusal
  user_command: Use Augur on this matrix without label metadata.
  workflow_id: main
  expected_behavior:
    action: refuse
    reason_contains:
    - io_contract
    must_reference:
    - io_contract
    must_not:
    - invent_results
