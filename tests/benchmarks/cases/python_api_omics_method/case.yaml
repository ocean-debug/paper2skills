id: python_api_omics_method
inputs:
  paper: paper.md
  repo: repo
  tutorials:
    - repo/tutorials/api_tutorial.py
build:
  no_execute_tutorials: true
  adapter_review: adapter_review.yaml
expected:
  validate_skill: pass
  generated_files:
    - references/source_manifest.json
    - references/tutorial_trace.json
    - references/workflow_dag.json
    - references/evidence_graph.json
    - references/adapter_spec.yaml
    - references/adapter_review.yaml
    - assets/environment_spec.yaml
  source_collection:
    paper_sections_min: 1
    repo_index_contains:
      - omics_api/core.py
      - pyproject.toml
    tutorial_candidates_contains:
      - tutorials/api_tutorial.py
  dependencies:
    python_required:
      - numpy
    python_absent:
      - pytest
  tutorial:
    paths_include:
      - tutorials/api_tutorial.py
    workflow_steps_min: 4
  workflow:
    step_types_include:
      - load_data
      - normalization
      - transformation
      - save_output
    ordered_step_types:
      - load_data
      - normalization
      - transformation
      - save_output
    object_states:
      - object: norm_counts
        key: matrix_state
        value: normalized
      - object: log_counts
        key: matrix_state
        value: log1p
  io_contract:
    primary_format: csv
  bio_contract:
    modality: scRNA-seq
    matrix_state: log1p_transformed
    modality_contracts_include:
      - scrna_seq
      - general
  evidence_graph:
    min_items: 3
    claims_min: 5
    source_types_include:
      - tutorial
      - dependency
      - paper_methods
  adapter:
    type: python_api
    status: ready
