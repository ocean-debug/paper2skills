id: r_package_omics_method
inputs:
  paper: paper.md
  repo: repo
  tutorials:
    - repo/examples/tutorial.R
build:
  no_execute_tutorials: true
expected:
  validate_skill: pass
  generated_files:
    - references/source_manifest.json
    - references/tutorial_trace.json
    - references/workflow_dag.json
    - references/evidence_graph.json
    - assets/environment_spec.yaml
  source_collection:
    paper_sections_min: 1
    repo_index_contains:
      - DESCRIPTION
      - NAMESPACE
      - R/run_omics.R
    tutorial_candidates_contains:
      - examples/tutorial.R
  dependencies:
    r_required:
      - OmicsR
      - SummarizedExperiment
    r_absent:
      - testthat
    optional_contains:
      - testthat
  tutorial:
    paths_include:
      - examples/tutorial.R
    workflow_steps_min: 3
  workflow:
    step_types_include:
      - load_data
      - normalization
      - save_output
  io_contract:
    primary_format: rds
  bio_contract:
    modality: scRNA-seq
    modality_contracts_include:
      - scrna_seq
      - general
  evidence_graph:
    min_items: 3
    source_types_include:
      - tutorial
      - dependency
      - paper_methods
  adapter:
    type: r_script
    status: candidate
