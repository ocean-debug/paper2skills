id: multi_modal_contract_method
inputs:
  paper: paper.md
  repo: repo
  tutorials:
    - repo/tutorials/bulk_tutorial.py
build:
  no_execute_tutorials: true
expected:
  validate_skill: pass
  generated_files:
    - references/bio_contract.yaml
    - references/io_contract.yaml
    - references/evidence_graph.json
    - references/workflow_dag.json
  source_collection:
    paper_sections_min: 2
    repo_index_contains:
      - tutorials/bulk_tutorial.py
    tutorial_candidates_contains:
      - tutorials/bulk_tutorial.py
  tutorial:
    paths_include:
      - tutorials/bulk_tutorial.py
    workflow_steps_min: 4
  workflow:
    step_types_include:
      - load_data
      - model_training
      - save_output
  io_contract:
    primary_format: count_matrix
    metadata_keys:
      sample_key: sample
      condition_key: condition
  bio_contract:
    modality: bulk RNA-seq
    matrix_state: raw_counts_loaded
    modality_contracts_include:
      - bulk_rna_seq
      - general
  evidence_graph:
    min_items: 3
    claims_min: 5
    source_types_include:
      - tutorial
      - paper_background
      - paper_methods
  adapter:
    type: notebook
    status: candidate
