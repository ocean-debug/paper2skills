id: notebook_heavy_omics_method
inputs:
  paper: paper.md
  repo: repo
  tutorials:
    - repo/notebooks/tutorial.ipynb
build:
  no_execute_tutorials: true
expected:
  validate_skill: pass
  generated_files:
    - references/tutorial_trace.json
    - references/notebook_execution_policy.json
    - references/evidence_graph.json
  source_collection:
    paper_sections_min: 1
    repo_index_contains:
      - notebooks/tutorial.ipynb
      - pyproject.toml
    tutorial_candidates_contains:
      - notebooks/tutorial.ipynb
  dependencies:
    python_required:
      - omicsnotebook
  tutorial:
    paths_include:
      - notebooks/tutorial.ipynb
    workflow_steps_min: 2
  workflow:
    step_types_include:
      - load_data
      - save_output
  notebook_policy:
    parameter_cells_min: 1
    cell_magics_include:
      - R
      - bash
      - capture
    risks_include:
      - install_command
      - network_download
      - shell_file_write
  evidence_graph:
    min_items: 3
    source_types_include:
      - tutorial
      - dependency
      - paper_methods
  adapter:
    type: notebook
    status: candidate
