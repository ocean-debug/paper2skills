id: cli_omics_method
inputs:
  paper: paper.md
  repo: repo
  tutorials:
    - repo/examples/tutorial.py
build:
  no_execute_tutorials: true
expected:
  validate_skill: pass
  generated_files:
    - references/source_manifest.json
    - references/tutorial_trace.json
    - references/adapter_spec.yaml
    - references/evidence_graph.json
  source_collection:
    paper_sections_min: 1
    repo_index_contains:
      - pyproject.toml
      - omics_cli/cli.py
    tutorial_candidates_contains:
      - examples/tutorial.py
  tutorial:
    paths_include:
      - examples/tutorial.py
    workflow_steps_min: 3
  workflow:
    step_types_include:
      - load_data
      - save_output
  evidence_graph:
    min_items: 2
    source_types_include:
      - tutorial
      - paper_methods
  adapter:
    type: cli
    status: candidate
  blocked_non_demo_run:
    status: blocked_adapter_not_ready
    returncode: 2
