[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2skill"
version = "0.1.0"
description = "Evidence-first Codex skill generator for algorithm papers, official repositories, and tutorials."
requires-python = ">=3.10"
dependencies = [
  "Jinja2>=3.1",
  "packaging>=23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
paper = [
  "markitdown[pdf,docx,pptx,xlsx]>=0.1",
]
html = [
  "beautifulsoup4>=4.12",
]

[project.scripts]
paper2skill = "paper2skill.cli:main"

[tool.setuptools.packages.find]
include = ["paper2skill*"]

[tool.setuptools.package-data]
paper2skill = [
  "schemas/*.yaml",
  "templates/codex_skill/**/*",
]
